name: Publicar site público

on:
  schedule:
    - cron: '17 */6 * * *'   # rede de segurança; o normal é o Firebase disparar quando os dados mudam
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: publicar-site, cancel-in-progress: false }

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dependências (firebase-admin das functions)
        run: npm ci --prefix functions
      - uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
      - name: Exporta do Firebase
        run: node scripts/exportar-firestore.mjs
      - name: Anonimiza e monta o site (para se sobrar dado pessoal)
        run: node scripts/publicar.mjs
      - name: Publica se mudou
        run: |
          rm -f gha-creds-*.json
          git config user.name "odin-cockpit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "Nada mudou no site."; exit 0; fi
          git commit -m "Site público: dados de $(TZ=America/Sao_Paulo date +'%d/%m %Hh%M')"
          git pull --rebase -q && git push
