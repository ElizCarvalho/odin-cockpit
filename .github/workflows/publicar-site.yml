name: Publicar site público

on:
  schedule:
    - cron: '17 */6 * * *'   # rede de segurança; o normal é o Firebase disparar quando os dados mudam
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: publicar-site, cancel-in-progress: false }

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cache dos navegadores do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Dependências (firebase-admin das functions, Playwright e Cucumber)
        timeout-minutes: 8
        run: |
          npm ci --prefix functions
          npm ci
          npx playwright install chromium webkit
          npx playwright install-deps chromium webkit
      - uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
      - name: Exporta do Firebase
        run: node scripts/exportar-firestore.mjs
      - name: Anonimiza e monta o site (para se sobrar dado pessoal)
        run: node scripts/publicar.mjs
      - name: Testa o site gerado antes de publicar (Chrome e Safari/iPhone)
        run: |
          rm -f gha-creds-*.json
          SITE_DIR=docs npx cucumber-js --tags @site --format summary
          SITE_DIR=docs NAVEGADOR=webkit npx cucumber-js --tags @site --format summary
      - name: Publica se mudou
        run: |
          rm -f gha-creds-*.json
          git config user.name "odin-cockpit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "Nada mudou no site."; exit 0; fi
          git commit -m "Site público: dados de $(TZ=America/Sao_Paulo date +'%d/%m %Hh%M')"
          git pull --rebase -q && git push
