name: Deploy do app (Firebase)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'artifact/index.html'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'scripts/build-app.mjs'
      - 'scripts/check.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

concurrency: { group: deploy-app, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cache dos navegadores do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Dependências
        timeout-minutes: 8
        run: |
          npm ci
          npm ci --prefix functions
          npx playwright install chromium webkit
          npx playwright install-deps chromium webkit
      - name: Validação (mesmo check de antes do commit)
        run: npm run check
      - name: Chaves das funções (se existirem)
        env:
          ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}'
          GH_DISPATCH_TOKEN: '${{ secrets.GH_DISPATCH_TOKEN }}'
        run: |
          : > functions/.env
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> functions/.env; fi
          if [ -n "$GH_DISPATCH_TOKEN" ]; then printf 'GH_DISPATCH_TOKEN=%s\n' "$GH_DISPATCH_TOKEN" >> functions/.env; fi
      - uses: google-github-actions/auth@v2
        with: { credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' }
      - name: Deploy
        run: npx -y firebase-tools@14 deploy --project odin-cockpit --only hosting,firestore,storage,functions --force --non-interactive
